<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Master Python Programs</title>
    <style>
        :root {
            --bg: #1e1e2e;
            --surface: #2a2a3c;
            --primary: #3776AB;
            --secondary: #FFD43B;
            --text: #cdd6f4;
            --text-dim: #a6adc8;
            --border: #45475a;
            --hover: #3b3b52;
            --success: #a6e3a1;
            --danger: #f38ba8;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: var(--bg);
            color: var(--text);
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            min-height: 100vh;
            padding: 1rem;
        }

        .container { max-width: 1400px; margin: 0 auto; }

        header {
            text-align: center;
            padding: 2rem 1rem;
            border-bottom: 2px solid var(--border);
            margin-bottom: 2rem;
        }

        .logo {
            font-size: 2.8rem;
            font-weight: 800;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .subtitle {
            color: var(--text-dim);
            margin-top: 0.5rem;
            font-size: 1.1rem;
        }

        .search-bar {
            width: 100%;
            max-width: 600px;
            margin: 2rem auto;
            padding: 0.8rem 1.2rem;
            background: var(--surface);
            border: 2px solid var(--border);
            border-radius: 12px;
            color: var(--text);
            font-size: 1rem;
            display: block;
            transition: all 0.2s;
        }
        .search-bar:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(55, 118, 171, 0.3);
        }

        .categories {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
            justify-content: center;
            margin-bottom: 2rem;
        }
        .cat-btn {
            background: var(--surface);
            border: 1px solid var(--border);
            color: var(--text-dim);
            padding: 0.5rem 1.2rem;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.2s;
            font-weight: 500;
        }
        .cat-btn:hover, .cat-btn.active {
            background: var(--primary);
            border-color: var(--primary);
            color: white;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 1.5rem;
        }

        .card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 1.5rem;
            transition: transform 0.2s, box-shadow 0.2s;
            display: flex;
            flex-direction: column;
            gap: 0.8rem;
        }
        .card:hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 24px rgba(0,0,0,0.3);
            border-color: var(--primary);
        }

        .card-title {
            font-size: 1.3rem;
            font-weight: 700;
        }

        .card-desc {
            color: var(--text-dim);
            font-size: 0.9rem;
            flex-grow: 1;
        }

        .code-preview {
            background: #11111b;
            border-radius: 8px;
            padding: 0.8rem;
            font-family: 'Fira Code', 'Cascadia Code', monospace;
            font-size: 0.8rem;
            overflow-x: auto;
            white-space: pre-wrap;
            color: #cdd6f4;
            max-height: 100px;
            border: 1px solid var(--border);
        }

        .btn-group {
            display: flex;
            gap: 0.5rem;
            margin-top: 0.5rem;
        }

        .btn {
            background: var(--primary);
            color: white;
            border: none;
            padding: 0.6rem 1rem;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: background 0.2s;
            display: flex;
            align-items: center;
            gap: 0.3rem;
            font-size: 0.9rem;
        }
        .btn:hover { background: #2e5f8e; }
        .btn-outline {
            background: transparent;
            border: 1px solid var(--primary);
            color: var(--primary);
        }
        .btn-outline:hover {
            background: var(--primary);
            color: white;
        }
        .btn-copy {
            background: var(--success);
            color: #1e1e2e;
        }
        .btn-copy:hover { background: #94e2a1; }

        .toast {
            position: fixed;
            bottom: 2rem;
            right: 2rem;
            background: var(--success);
            color: #1e1e2e;
            padding: 0.8rem 1.5rem;
            border-radius: 8px;
            font-weight: 600;
            transform: translateY(100px);
            opacity: 0;
            transition: all 0.3s;
            z-index: 1000;
        }
        .toast.show {
            transform: translateY(0);
            opacity: 1;
        }

        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(4px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 999;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s;
        }
        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }
        .modal {
            background: var(--surface);
            border-radius: 20px;
            padding: 2rem;
            max-width: 800px;
            width: 90%;
            max-height: 80vh;
            overflow-y: auto;
            border: 1px solid var(--border);
        }
        .modal h2 { margin-bottom: 1rem; }
        .modal .code-block {
            background: #11111b;
            border-radius: 10px;
            padding: 1rem;
            font-family: 'Fira Code', monospace;
            font-size: 0.9rem;
            white-space: pre-wrap;
            overflow-x: auto;
            border: 1px solid var(--border);
            margin: 1rem 0;
        }
        .modal-close {
            float: right;
            background: none;
            border: none;
            color: var(--text-dim);
            font-size: 1.5rem;
            cursor: pointer;
        }
        .modal-url {
            background: var(--bg);
            border: 1px solid var(--border);
            padding: 0.5rem;
            border-radius: 6px;
            font-family: monospace;
            word-break: break-all;
            margin: 0.5rem 0;
            font-size: 0.9rem;
            color: var(--secondary);
        }

        @media (max-width: 600px) {
            .logo { font-size: 2rem; }
            .grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div class="logo">🐍 Master Python Programs</div>
            <p class="subtitle">Fetch any .py file, <code style="background:#2a2a3c;padding:0.2rem 0.5rem;border-radius:4px;">exec()</code> it locally, and see the magic</p>
        </header>

        <input type="text" class="search-bar" id="searchInput" placeholder="Search programs by name or description...">

        <div class="categories" id="categoryButtons">
            <!-- Categories will be dynamically generated -->
        </div>

        <div class="grid" id="programGrid"></div>
    </div>

    <!-- Toast -->
    <div class="toast" id="toast">URL copied to clipboard!</div>

    <!-- Modal -->
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal">
            <button class="modal-close" id="modalClose">&times;</button>
            <h2 id="modalTitle"></h2>
            <p id="modalDesc" style="color:var(--text-dim)"></p>
            <div class="modal-url" id="modalUrl"></div>
            <button class="btn btn-copy" id="modalCopyBtn">📋 Copy URL</button>
            <div class="code-block" id="modalCode"></div>
        </div>
    </div>

    <script>
        // Load program list from programs.json
        let programs = [];
        let categories = new Set();

        async function loadPrograms() {
            try {
                const response = await fetch('programs.json');
                if (!response.ok) throw new Error('Failed to load programs.json');
                programs = await response.json();
                // Extract unique categories
                categories = new Set(programs.map(p => p.category).filter(Boolean));
                setupCategories();
                renderPrograms(programs);
            } catch (err) {
                document.getElementById('programGrid').innerHTML = `
                    <div style="grid-column:1/-1;text-align:center;color:var(--danger);padding:2rem;">
                        ⚠️ Could not load programs.json. Make sure the file exists and is valid JSON.
                    </div>`;
                console.error(err);
            }
        }

        function setupCategories() {
            const container = document.getElementById('categoryButtons');
            container.innerHTML = '<button class="cat-btn active" data-category="all">All</button>';
            [...categories].sort().forEach(cat => {
                const btn = document.createElement('button');
                btn.className = 'cat-btn';
                btn.setAttribute('data-category', cat);
                btn.textContent = cat;
                container.appendChild(btn);
            });

            // Category click handler
            container.addEventListener('click', (e) => {
                if (e.target.classList.contains('cat-btn')) {
                    document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
                    e.target.classList.add('active');
                    const cat = e.target.getAttribute('data-category');
                    const searchTerm = document.getElementById('searchInput').value.toLowerCase();
                    filterAndRender(cat, searchTerm);
                }
            });
        }

        function escapeHtml(text) {
            return text.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
        }

        function renderPrograms(filteredProgs) {
            const grid = document.getElementById('programGrid');
            grid.innerHTML = '';
            if (filteredProgs.length === 0) {
                grid.innerHTML = '<div style="grid-column:1/-1;text-align:center;padding:2rem;color:var(--text-dim)">No programs found.</div>';
                return;
            }
            filteredProgs.forEach(prog => {
                const preview = prog.code ? prog.code.slice(0, 150) : '# View code for details';
                const card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `
                    <div class="card-title">${escapeHtml(prog.title)}</div>
                    <div class="card-desc">${escapeHtml(prog.desc || '')}</div>
                    <div class="code-preview">${escapeHtml(preview)}</div>
                    <div class="btn-group">
                        <button class="btn btn-copy copy-btn" data-file="${escapeHtml(prog.file)}">📋 Copy URL</button>
                        <button class="btn btn-outline view-btn" data-title="${escapeHtml(prog.title)}" data-desc="${escapeHtml(prog.desc || '')}" data-file="${escapeHtml(prog.file)}" data-code="${escapeHtml(prog.code || '')}">🔍 View Code</button>
                    </div>
                `;
                grid.appendChild(card);
            });
            attachCardEvents();
        }

        function showToast(msg) {
            const toast = document.getElementById('toast');
            toast.textContent = msg;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 2000);
        }

        function copyToClipboard(text) {
            navigator.clipboard.writeText(text).then(() => showToast('URL copied!'));
        }

        function attachCardEvents() {
            document.querySelectorAll('.copy-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    const file = btn.getAttribute('data-file');
                    // Build the full URL to the .py file
                    const base = window.location.href.replace(/\/[^/]*$/, '');
                    const fullUrl = `${base}/programs/${file}`;
                    copyToClipboard(fullUrl);
                });
            });

            document.querySelectorAll('.view-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    const title = btn.getAttribute('data-title');
                    const desc = btn.getAttribute('data-desc');
                    const file = btn.getAttribute('data-file');
                    const code = btn.getAttribute('data-code');
                    openModal(title, desc, file, code);
                });
            });
        }

        function openModal(title, desc, file, code) {
            document.getElementById('modalTitle').textContent = title;
            document.getElementById('modalDesc').textContent = desc;
            const base = window.location.href.replace(/\/[^/]*$/, '');
            document.getElementById('modalUrl').textContent = `${base}/programs/${file}`;
            document.getElementById('modalCode').textContent = code;
            document.getElementById('modalOverlay').classList.add('active');

            document.getElementById('modalCopyBtn').onclick = () => {
                const url = document.getElementById('modalUrl').textContent;
                copyToClipboard(url);
            };
        }

        // Search input
        document.getElementById('searchInput').addEventListener('input', (e) => {
            const searchTerm = e.target.value.toLowerCase();
            const activeCat = document.querySelector('.cat-btn.active')?.getAttribute('data-category') || 'all';
            filterAndRender(activeCat, searchTerm);
        });

        function filterAndRender(category, searchTerm) {
            let filtered = programs;
            if (category !== 'all') {
                filtered = filtered.filter(p => p.category === category);
            }
            if (searchTerm) {
                filtered = filtered.filter(p =>
                    p.title.toLowerCase().includes(searchTerm) ||
                    (p.desc && p.desc.toLowerCase().includes(searchTerm))
                );
            }
            renderPrograms(filtered);
        }

        // Modal close handlers
        document.getElementById('modalClose').addEventListener('click', () => {
            document.getElementById('modalOverlay').classList.remove('active');
        });
        document.getElementById('modalOverlay').addEventListener('click', (e) => {
            if (e.target === document.getElementById('modalOverlay')) {
                document.getElementById('modalOverlay').classList.remove('active');
            }
        });

        // Kick off loading
        loadPrograms();
    </script>
</body>
</html>
