<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Master Python Programs</title>
    <style>
        :root {
            --bg: #1e1e2e;
            --surface: #2a2a3c;
            --primary: #3776AB;
            --secondary: #FFD43B;
            --text: #cdd6f4;
            --text-dim: #a6adc8;
            --border: #45475a;
            --hover: #3b3b52;
            --success: #a6e3a1;
            --danger: #f38ba8;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: var(--bg);
            color: var(--text);
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            min-height: 100vh;
            padding: 1rem;
        }

        .container { max-width: 1400px; margin: 0 auto; }

        header {
            text-align: center;
            padding: 2rem 1rem;
            border-bottom: 2px solid var(--border);
            margin-bottom: 2rem;
        }

        .logo {
            font-size: 2.8rem;
            font-weight: 800;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .subtitle {
            color: var(--text-dim);
            margin-top: 0.5rem;
            font-size: 1.1rem;
        }

        .search-bar {
            width: 100%;
            max-width: 600px;
            margin: 2rem auto;
            padding: 0.8rem 1.2rem;
            background: var(--surface);
            border: 2px solid var(--border);
            border-radius: 12px;
            color: var(--text);
            font-size: 1rem;
            display: block;
            transition: all 0.2s;
        }
        .search-bar:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(55, 118, 171, 0.3);
        }

        .categories {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
            justify-content: center;
            margin-bottom: 2rem;
        }
        .cat-btn {
            background: var(--surface);
            border: 1px solid var(--border);
            color: var(--text-dim);
            padding: 0.5rem 1.2rem;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.2s;
            font-weight: 500;
        }
        .cat-btn:hover, .cat-btn.active {
            background: var(--primary);
            border-color: var(--primary);
            color: white;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 1.5rem;
        }

        .card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 1.5rem;
            transition: transform 0.2s, box-shadow 0.2s;
            display: flex;
            flex-direction: column;
            gap: 0.8rem;
        }
        .card:hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 24px rgba(0,0,0,0.3);
            border-color: var(--primary);
        }

        .card-title {
            font-size: 1.3rem;
            font-weight: 700;
        }

        .card-desc {
            color: var(--text-dim);
            font-size: 0.9rem;
            flex-grow: 1;
        }

        .code-preview {
            background: #11111b;
            border-radius: 8px;
            padding: 0.8rem;
            font-family: 'Fira Code', 'Cascadia Code', monospace;
            font-size: 0.8rem;
            overflow-x: auto;
            white-space: pre-wrap;
            color: #cdd6f4;
            max-height: 100px;
            border: 1px solid var(--border);
        }

        .btn-group {
            display: flex;
            gap: 0.5rem;
            margin-top: 0.5rem;
        }

        .btn {
            background: var(--primary);
            color: white;
            border: none;
            padding: 0.6rem 1rem;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: background 0.2s;
            display: flex;
            align-items: center;
            gap: 0.3rem;
            font-size: 0.9rem;
        }
        .btn:hover { background: #2e5f8e; }
        .btn-outline {
            background: transparent;
            border: 1px solid var(--primary);
            color: var(--primary);
        }
        .btn-outline:hover {
            background: var(--primary);
            color: white;
        }
        .btn-copy {
            background: var(--success);
            color: #1e1e2e;
        }
        .btn-copy:hover { background: #94e2a1; }

        .toast {
            position: fixed;
            bottom: 2rem;
            right: 2rem;
            background: var(--success);
            color: #1e1e2e;
            padding: 0.8rem 1.5rem;
            border-radius: 8px;
            font-weight: 600;
            transform: translateY(100px);
            opacity: 0;
            transition: all 0.3s;
            z-index: 1000;
        }
        .toast.show {
            transform: translateY(0);
            opacity: 1;
        }

        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(4px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 999;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s;
        }
        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }
        .modal {
            background: var(--surface);
            border-radius: 20px;
            padding: 2rem;
            max-width: 800px;
            width: 90%;
            max-height: 80vh;
            overflow-y: auto;
            border: 1px solid var(--border);
        }
        .modal h2 { margin-bottom: 1rem; }
        .modal .code-block {
            background: #11111b;
            border-radius: 10px;
            padding: 1rem;
            font-family: 'Fira Code', monospace;
            font-size: 0.9rem;
            white-space: pre-wrap;
            overflow-x: auto;
            border: 1px solid var(--border);
            margin: 1rem 0;
        }
        .modal-close {
            float: right;
            background: none;
            border: none;
            color: var(--text-dim);
            font-size: 1.5rem;
            cursor: pointer;
        }
        .modal-url {
            background: var(--bg);
            border: 1px solid var(--border);
            padding: 0.5rem;
            border-radius: 6px;
            font-family: monospace;
            word-break: break-all;
            margin: 0.5rem 0;
            font-size: 0.9rem;
            color: var(--secondary);
        }

        @media (max-width: 600px) {
            .logo { font-size: 2rem; }
            .grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>

def linear_search(arr, target):

                file: "binary_search.py",
                code: `# binary_search.py
def binary_search(arr, target):
    low, high = 0, len(arr)-1
    while low <= high:
        mid = (low + high) // 2
        if arr[mid] == target:
            return mid
        elif arr[mid] < target:
            low = mid + 1
        else:
            high = mid - 1
    return -1

sorted_arr = [1,3,5,7,9,11,13]
print(f"Index of 7: {binary_search(sorted_arr, 7)}")`

                file: "bubble_sort.py",
                code: `# bubble_sort.py
def bubble_sort(arr):
    n = len(arr)
    for i in range(n):
        for j in range(0, n-i-1):
            if arr[j] > arr[j+1]:
                arr[j], arr[j+1] = arr[j+1], arr[j]
    return arr

nums = [64, 34, 25, 12, 22, 11, 90]
print(f"Sorted: {bubble_sort(nums)}")`
            },

                file: "stack.py",
                code: `# stack.py
class Stack:
    def __init__(self):
        self.items = []
    def push(self, item):
        self.items.append(item)
    def pop(self):
        return self.items.pop() if not self.is_empty() else None
    def peek(self):
        return self.items[-1] if not self.is_empty() else None
    def is_empty(self):
        return len(self.items) == 0

s = Stack()
s.push(1); s.push(2); s.push(3)
print("Popped:", s.pop())
print("Top:", s.peek())`

from collections import deque

class Queue:
    def __init__(self):
        self.items = deque()
    def enqueue(self, item):
        self.items.append(item)
    def dequeue(self):
        return self.items.popleft() if not self.is_empty() else None
    def is_empty(self):
        return len(self.items) == 0

q = Queue()
q.enqueue('a'); q.enqueue('b'); q.enqueue('c')
print("Dequeued:", q.dequeue())
print("Next:", q.items[0] if not q.is_empty() else None)`

        const basePath = window.location.origin + window.location.pathname.replace(/\/[^/]*$/, "");
        const programsPath = basePath ? `${basePath}/programs/` : 'programs/';

        function renderPrograms(filteredProgs) {
            const grid = document.getElementById('programGrid');
            grid.innerHTML = '';
            filteredProgs.forEach(prog => {
                const card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `
                    <div class="card-title">${prog.title}</div>
                    <div class="card-desc">${prog.desc}</div>
                    <div class="code-preview">${escapeHtml(prog.code.slice(0, 150))}</div>
                    <div class="btn-group">
                        <button class="btn btn-copy copy-btn" data-file="${prog.file}">📋 Copy URL</button>
                        <button class="btn btn-outline view-btn" data-title="${prog.title}" data-desc="${prog.desc}" data-file="${prog.file}" data-code="${escapeHtml(prog.code)}">🔍 View Code</button>
                    </div>
                `;
                grid.appendChild(card);
            });
            attachCardEvents();
        }

        function escapeHtml(text) {
            return text.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
        }

        function showToast(msg) {
            const toast = document.getElementById('toast');
            toast.textContent = msg;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 2000);
        }
